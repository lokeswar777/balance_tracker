<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Balance History - Money Tracker</title>
  <style>
    :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f3ff;--card:#fff;--tx:#1e1b3a;--mu:#6b6a85;--bd:#e6e4f7;--ac:#6d5dfc;--up:#10b981;--down:#f43f5e}
    @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e1a;--card:#1a1930;--tx:#ecebff;--mu:#9b9ab8;--bd:#2b2a48;--ac:#8b7dff;--up:#34d399;--down:#fb7185}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{max-width:1000px;margin:0 auto;padding:14px}
    .head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    h1{font-size:26px;margin:0}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    a,button,input{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);text-decoration:none}
    input{width:160px;min-width:0}
    button{cursor:pointer}
    button.primary{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
    button:disabled{opacity:.5;cursor:not-allowed}
    .summary,.table-wrap{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
    .summary small{display:block;color:var(--mu)}
    .summary strong{font-size:22px}
    .status{color:var(--mu);margin:8px 0 0}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:540px}
    th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd)}
    th{color:var(--mu);font-size:12px}
    td.amount,th.amount{text-align:right}
    td.note{color:var(--mu);max-width:240px;overflow-wrap:anywhere}
    .up{color:var(--up)}.down{color:var(--down)}
    .empty{text-align:center;color:var(--mu);padding:24px}
    @media(max-width:520px){main{padding:10px}.head{align-items:flex-start}h1{font-size:22px}}
  </style>
</head>
<body>
  <main>
    <header class="head">
      <h1>Balance history</h1>
      <div class="actions">
        <a href="index.html">Back to dashboard</a>
        <input id="syncPassword" type="password" placeholder="Sync password" aria-label="GitHub sync password" autocomplete="current-password">
        <button id="sync" type="button">Sync GitHub</button>
        <button class="primary" id="export" type="button">Download CSV</button>
      </div>
    </header>
    <section class="summary" aria-live="polite">
      <small>Current balance</small>
      <strong id="balance">₹0</strong>
      <p class="status" id="status" aria-live="polite"></p>
    </section>
    <section class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th class="amount">Balance</th><th class="amount">Change</th><th>Note</th></tr></thead>
        <tbody id="entries"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No balance entries yet. Add one from the dashboard.</div>
    </section>
  </main>
  <script src="sync.js"></script>
  <script>
    const $=id=>document.getElementById(id);
    const format=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2});
    const inr=value=>format.format(value);
    const percent=(current,previous)=>previous?((current-previous)/Math.abs(previous)*100):0;
    const dateLabel=date=>new Date(date+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
    let entries=[];

    function loadHistory(){
      try{
        const stored=localStorage.getItem('mt2');
        const data=stored?JSON.parse(stored):{h:[]};
        if(!data||!Array.isArray(data.h))throw new Error('Stored balance history has an invalid format.');
        entries=[...data.h].sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id);
        render();
      }catch(error){
        $('status').textContent='Could not load balance history: '+error.message;
        $('export').disabled=true;
        $('empty').hidden=false;
      }
    }

    $('syncPassword').value=BalanceSync.savedPassword();
    $('sync').addEventListener('click',async()=>{
      try{
        await BalanceSync.connect($('syncPassword').value||BalanceSync.savedPassword(),entries,remote=>{
          localStorage.setItem('mt2',JSON.stringify({h:remote}));
          loadHistory();
          if(BalanceSync.savedPassword())$('sync').click();
        },message=>{$('status').textContent=message});
        $('syncPassword').value=BalanceSync.savedPassword();
      }catch(error){$('status').textContent=error.message}
    });

    function render(){
      const body=$('entries');
      body.textContent='';
      $('balance').textContent=entries.length?inr(entries[entries.length-1].b):inr(0);
      $('empty').hidden=entries.length>0;
      $('status').textContent=entries.length?entries.length+' entr'+(entries.length===1?'y':'ies')+' saved in this browser.':'';
      [...entries].reverse().forEach(entry=>{
        const index=entries.indexOf(entry),previous=index?entries[index-1]:null;
        const row=document.createElement('tr');
        const date=document.createElement('td');date.textContent=dateLabel(entry.d);
        const balance=document.createElement('td');balance.className='amount';balance.textContent=inr(entry.b);
        const change=document.createElement('td');change.className='amount';
        if(previous){
          const difference=entry.b-previous.b;
          change.className='amount '+(difference>=0?'up':'down');
          change.textContent=(difference>=0?'+':'−')+inr(Math.abs(difference))+' ('+(percent(entry.b,previous.b)>=0?'+':'')+percent(entry.b,previous.b).toFixed(1)+'%)';
        }else change.textContent='—';
        const note=document.createElement('td');note.className='note';note.textContent=entry.n||'Balance entry';
        row.append(date,balance,change,note);body.appendChild(row);
      });
    }

    function csvCell(value){
      let text=String(value??'');
      if(typeof value!=='number'&&/^[=+\-@]/.test(text))text="'"+text;
      return '"'+text.replace(/"/g,'""')+'"';
    }

    $('export').addEventListener('click',()=>{
      const rows=[['Date','Balance (INR)','Change (INR)','Change (%)','Note']];
      entries.forEach((entry,index)=>{
        const previous=index?entries[index-1]:null;
        const difference=previous?entry.b-previous.b:'';
        const changePercent=previous?percent(entry.b,previous.b).toFixed(2):'';
        rows.push([entry.d,entry.b,difference,changePercent,entry.n||'Balance entry']);
      });
      const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');
      const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
      const link=document.createElement('a');link.href=url;link.download='balance-history.csv';link.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    });

    loadHistory();
  </script>
</body>
</html>
